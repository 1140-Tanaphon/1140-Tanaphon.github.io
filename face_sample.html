<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;}
    a-scene {width: 100%;  height: 100%;}
  </style>
</head>

<body>
<a-scene mindar-face embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <a-asset-item id="helmetModel" src="https://1140-Tanaphon.github.io/astronaut_helmet.glb"></a-asset-item>
    <a-asset-item id="headModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"></a-asset-item>
  </a-assets>


  <!-- Anchor กับตำแหน่งบนใบหน้า -->
  <a-entity mindar-face-target="anchorIndex: 1">
  <a-gltf-model rotation="0 -0 0" position="1 0.3 0" scale="0.05 0.05 0.05" src="#helmetModel"></a-gltf-model>
</a-entity>






  <a-camera active="false" position="0 0 0"> </a-camera>

</a-scene>
</body>
</html>
